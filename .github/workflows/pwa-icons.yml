name: Build PWA icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PNG icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          import json
          cairosvg.svg2png(url='icon-192.svg', write_to='icon-192.png', output_width=192, output_height=192)
          cairosvg.svg2png(url='icon-512.svg', write_to='icon-512.png', output_width=512, output_height=512)
          p='manifest.webmanifest'
          m=json.load(open(p))
          m['icons']=[
            {'src':'icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
            {'src':'icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
          ]
          open(p,'w').write(json.dumps(m,indent=2)+'\n')
          PY
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-192.png icon-512.png manifest.webmanifest
          git diff --cached --quiet || git commit -m 'Add installable PWA PNG icons'
          git push
