name: GardenPro PWA fix
on:
  push:
    branches: [main]

jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, 'PWA registration cleanup')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix registration line
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("}\\\\nasync function boot(){", "}\\nasync function boot(){")
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "GardenPro Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "PWA registration cleanup"
          git push
