name: Build GardenPro Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GardenPro
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node packages
        run: npm install

      - name: Prepare mobile web files
        run: |
          rm -rf www
          mkdir www
          cp index.html manifest.webmanifest sw.js www/
          cp icon-192.png icon-512.png www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Configure Android 16 / API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/variables.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', s)
          s=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
          s=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
          p.write_text(s)
          PY

      - name: Build Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload GardenPro Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: GardenPro-Play-Bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
