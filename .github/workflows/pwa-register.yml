name: GardenPro PWA registration
on:
  push:
    branches: [main]

jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, 'Enable GardenPro PWA registration')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add service worker registration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="async function boot(){"
          line="if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}\\n"
          if "navigator.serviceWorker.register('./sw.js')" not in s:
              s=s.replace(marker,line+marker)
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "GardenPro Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable GardenPro PWA registration"
          git push
