<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7a3d">
<link rel="manifest" href="manifest.webmanifest">
<title>GardenPro</title>
<style>
:root{--g:#1f7a3d;--dark:#173b24;--bg:#f4f7f4;--card:#fff;--muted:#68736c;--line:#dce5de;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#172019}header{background:var(--g);color:#fff;padding:17px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0002}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}header h1{margin:0;font-size:25px}header p{margin:3px 0 0;opacity:.9}main{max-width:820px;margin:auto;padding:16px 16px 100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.stat{font-size:28px;font-weight:800}.muted{color:var(--muted);font-size:13px}h2{font-size:22px;margin:16px 0 10px}h3{margin:0 0 8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.form{display:grid;gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd7ce;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:80px}label{display:block;font-size:13px;font-weight:700;margin-top:4px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:700;background:var(--g);color:#fff}button.secondary{background:#e8efe9;color:var(--dark)}button.danger{background:var(--red)}button:disabled{opacity:.45}.small{padding:8px 10px;font-size:13px}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item strong{display:block}.item small{color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8f2ea;color:var(--g);font-size:12px;font-weight:700}.badge.red{background:#fde8e7;color:var(--red)}.empty{padding:24px;text-align:center;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:7px;z-index:30}nav button{background:transparent;color:var(--dark);flex:1;max-width:125px;padding:9px 3px;font-size:12px}nav button.active{background:#e8f2ea;color:var(--g)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:82px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:11px}.day.today{outline:2px solid var(--g)}.jobdot{background:#e8f2ea;border-radius:6px;padding:4px;margin:3px 0;overflow:hidden}.money{font-weight:800}.redtext{color:var(--red)}#login{max-width:430px;margin:60px auto}.search{margin-bottom:10px}@media(max-width:650px){.grid3{grid-template-columns:1fr}.two{grid-template-columns:1fr}.calendar{gap:2px}.day{min-height:70px;padding:4px}}
@media print{header,nav,.noPrint{display:none!important}body{background:#fff}main{padding:0}.card{box-shadow:none}}
</style>
</head>
<body>
<header id="header"></header><main id="app"></main><div id="nav"></div><div id="profileModal" style="display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:18px;z-index:100"><div style="background:#fff;border-radius:18px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto"><div class="row"><h2 style="margin:0">My GardenPro</h2><button class="secondary small" onclick="closeProfile()">Close</button></div><p class="muted">Your business details appear on printed quotes and invoices.</p><div class="form"><label>Business Name</label><input id="pbusiness"><label>Your Name</label><input id="pname"><label>Phone</label><input id="pphone"><label>Email</label><input id="pemail" type="email"><label>Business Address</label><textarea id="paddress"></textarea><label>VAT/Tax Number</label><input id="ptax"><button onclick="saveProfile()">Save profile</button></div></div></div>
<script>
const URL='https://acvbzacoopgpszdcdkbq.supabase.co',KEY='sb_publishable_5gbQgDnijY4r6lPmTzYBsA_PD9Dgp4z',SK='gardenpro_session_v3';
let session=JSON.parse(localStorage.getItem(SK)||localStorage.getItem('gardenpro_session_v2')||'null'),data={customers:[],jobs:[],quotes:[],invoices:[],expenses:[]},page='home',cal=new Date(),search='';
const fmtMoney=n=>'£'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';
const days={Weekly:7,Fortnightly:14,'4-weekly':28,'6-weekly':42};
function H(){return {'apikey':KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'}}
async function req(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{...H(),...(opt.headers||{})}}),t=await r.text(),b;try{b=t?JSON.parse(t):null}catch{b=t}if(!r.ok)throw Error(b?.message||b?.error_description||b?.hint||t||'Request failed');return b}
async function auth(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})}}),b={};try{b=await r.json()}catch{}if(!r.ok)throw Error(b.error_description||b.msg||b.message||'Login failed');return b}
function save(){localStorage.setItem(SK,JSON.stringify(session))}
function cname(id){return data.customers.find(c=>c.id===id)?.name||'Customer'}
function setPage(p){page=p;render()}
let profile=JSON.parse(localStorage.getItem('gardenpro_profile_v2')||'{"business":"GardenPro","name":"","phone":"","email":"","address":"","tax":""}');
function openProfile(){profileModal.style.display='flex';pbusiness.value=profile.business||'';pname.value=profile.name||'';pphone.value=profile.phone||'';pemail.value=profile.email||'';paddress.value=profile.address||'';ptax.value=profile.tax||''}
function closeProfile(){profileModal.style.display='none'}
function saveProfile(){profile={business:pbusiness.value.trim()||'GardenPro',name:pname.value.trim(),phone:pphone.value.trim(),email:pemail.value.trim(),address:paddress.value.trim(),tax:ptax.value.trim()};localStorage.setItem('gardenpro_profile_v2',JSON.stringify(profile));closeProfile();head()}

function head(){document.getElementById('header').innerHTML=session?`<div class="top"><div><h1>🌿 GardenPro</h1><p>Professional gardener business manager</p></div><div style="display:flex;gap:8px"><button class="secondary small noPrint" onclick="openProfile()">👤 My GardenPro</button><button class="secondary small noPrint" onclick="logout()">Log out</button></div></div>`:`<h1>🌿 GardenPro</h1><p>Professional gardener business manager</p>`}
function loginScreen(msg=''){document.getElementById('nav').innerHTML='';app.innerHTML=`<div id="login" class="card"><h2>GardenPro login</h2><p class="muted">Your gardening business in one place.</p>${msg?`<p class="badge red">${esc(msg)}</p>`:''}<div class="form"><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button onclick="login()">Log in</button><button class="secondary" onclick="signup()">Create account</button></div></div>`}
async function login(){try{let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return loginScreen('Enter your email and password.');session=await auth('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});session.user_id=session.user?.id||session.user_id;save();await boot()}catch(e){loginScreen(e.message)}}
async function signup(){try{let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(password.length<6)return loginScreen('Password must be at least 6 characters.');let b=await auth('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(b.access_token){session=b;session.user_id=b.user?.id;save();await boot()}else loginScreen('Account created. Check your email, then log in.')}catch(e){loginScreen(e.message)}}
async function logout(){try{await auth('/auth/v1/logout',{method:'POST',headers:{Authorization:'Bearer '+session.access_token}})}catch(e){}session=null;localStorage.removeItem(SK);head();loginScreen()}
async function load(){let getRows=(t,o)=>req('/rest/v1/'+t+'?select=*&'+o);let [c,j,qt,i]=await Promise.all([getRows('customers','order=name.asc'),getRows('jobs','order=date.asc'),getRows('quotes','order=created_at.desc'),getRows('invoices','order=created_at.desc')]);data.customers=c||[];data.jobs=j||[];data.quotes=qt||[];data.invoices=i||[];try{data.expenses=await getRows('expenses','order=date.desc')}catch{data.expenses=[]}}
function navigation(){document.getElementById('nav').innerHTML=`<nav>${[['home','Home'],['customers','Customers'],['jobs','Jobs'],['calendar','Calendar'],['quotes','Quotes'],['invoices','Invoices'],['money','Money']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="setPage('${x[0]}')">${x[1]}</button>`).join('')}</nav>`}
async function render(){head();if(!session){loginScreen();return}navigation();if(page==='home')home();if(page==='customers')customers();if(page==='jobs')jobs();if(page==='calendar')calendar();if(page==='quotes')quotes();if(page==='invoices')invoices();if(page==='money')moneyPage()}
function home(){let t=today(),tod=data.jobs.filter(j=>j.date===t&&!j.done),up=data.jobs.filter(j=>j.date>=t&&!j.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6),out=data.invoices.filter(i=>i.status!=='Paid').reduce((a,x)=>a+Number(x.amount||0),0),paid=data.invoices.filter(i=>i.status==='Paid').reduce((a,x)=>a+Number(x.amount||0),0),exp=data.expenses.reduce((a,x)=>a+Number(x.amount||0),0);app.innerHTML=`<h2>Good to see you</h2><div class="grid"><div class="card"><div class="muted">Today's jobs</div><div class="stat">${tod.length}</div></div><div class="card"><div class="muted">Customers</div><div class="stat">${data.customers.length}</div></div><div class="card"><div class="muted">Money outstanding</div><div class="stat">${fmtMoney(out)}</div></div><div class="card"><div class="muted">Recorded profit</div><div class="stat">${fmtMoney(paid-exp)}</div></div></div><div class="card"><div class="row"><h3>Today's jobs</h3><button onclick="setPage('jobs')">+ Job</button></div>${tod.length?`<div class="list">${tod.map(jobItem).join('')}</div>`:'<div class="empty">No jobs today.</div>'}</div><div class="card"><div class="row"><h3>Upcoming work</h3><button class="secondary" onclick="setPage('calendar')">Calendar</button></div>${up.length?`<div class="list">${up.map(jobItem).join('')}</div>`:'<div class="empty">No upcoming jobs.</div>'}</div>`}
function customers(){let a=data.customers.filter(c=>!search||c.name.toLowerCase().includes(search.toLowerCase())||String(c.phone||'').includes(search));app.innerHTML=`<h2>Customers</h2><div class="card"><label>Search</label><input class="search" value="${esc(search)}" oninput="search=this.value;customers()"><div class="form"><label>Name</label><input id="cn"><label>Address</label><input id="ca"><div class="two"><div><label>Phone</label><input id="cp"></div><div><label>Email</label><input id="ce" type="email"></div></div><label>Notes</label><textarea id="ct"></textarea><button onclick="addCustomer()">Add customer</button></div></div><div class="list">${a.length?a.map(c=>`<div class="card"><div class="row"><div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.address||'')}</div><div class="muted">${esc(c.phone||'')} ${c.email?' · '+esc(c.email):''}</div></div><button class="danger small" onclick="delCustomer('${c.id}')">Delete</button></div><div class="muted" style="margin-top:8px">${esc(c.notes||'')}</div><button class="secondary small" style="margin-top:8px" onclick="customerHistory('${c.id}')">Customer history</button></div>`).join(''):'<div class="card empty">No customers yet.</div>'}</div>`}
async function addCustomer(){if(!cn.value.trim())return alert('Enter a name.');try{await req('/rest/v1/customers',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user_id,name:cn.value.trim(),address:ca.value,phone:cp.value,email:ce.value,notes:ct.value})});await load();customers()}catch(e){alert(e.message)}}
async function delCustomer(id){if(!confirm('Delete this customer and their related records?'))return;try{await req('/rest/v1/customers?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await load();customers()}catch(e){alert(e.message)}}
function customerHistory(id){let c=data.customers.find(x=>x.id===id),j=data.jobs.filter(x=>x.customer_id===id),q=data.quotes.filter(x=>x.customer_id===id),i=data.invoices.filter(x=>x.customer_id===id);app.innerHTML=`<button class="secondary" onclick="customers()">← Customers</button><h2>${esc(c.name)}</h2><div class="card"><b>Address</b><p>${esc(c.address||'—')}</p><b>Phone</b><p>${esc(c.phone||'—')}</p><b>Email</b><p>${esc(c.email||'—')}</p><b>Notes</b><p>${esc(c.notes||'—')}</p></div><div class="card"><h3>Jobs</h3>${j.length?j.map(jobItem).join(''):'<div class="empty">No jobs.</div>'}</div><div class="card"><h3>Quotes</h3>${q.length?q.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><small>${fmtMoney(x.amount)} · ${esc(x.status)}</small></div></div>`).join(''):'<div class="empty">No quotes.</div>'}</div><div class="card"><h3>Invoices</h3>${i.length?i.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><small>${fmtMoney(x.amount)} · ${esc(x.status)}</small></div></div>`).join(''):'<div class="empty">No invoices.</div>'}</div>`}
function jobs(){app.innerHTML=`<h2>Jobs</h2><div class="card"><div class="form"><label>Customer</label><select id="jc">${data.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Job</label><input id="jt" placeholder="Garden maintenance"><div class="two"><div><label>Date</label><input id="jd" type="date" value="${today()}"></div><div><label>Price</label><input id="jp" type="number" step=".01" min="0"></div></div><label>Repeat</label><select id="jr"><option>One-off</option><option>Weekly</option><option>Fortnightly</option><option>4-weekly</option><option>6-weekly</option></select><button onclick="addJob()" ${data.customers.length?'':'disabled'}>Add job</button></div></div><div class="list">${data.jobs.map(jobItem).join('')||'<div class="card empty">No jobs yet.</div>'}</div>`}
function jobItem(j){return `<div class="item"><div><strong>${esc(j.title)} — ${esc(cname(j.customer_id))}</strong><small>${fmtDate(j.date)} · ${esc(j.repeat)} · ${fmtMoney(j.price)} ${j.done?'<span class="badge">Done</span>':''}</small></div><button class="${j.done?'secondary':''} small" onclick="toggleJob('${j.id}')">${j.done?'Done':'Complete'}</button></div>`}
async function addJob(){if(!jc.value||!jt.value.trim()||!jd.value)return alert('Enter customer, job and date.');try{await req('/rest/v1/jobs',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user_id,customer_id:jc.value,title:jt.value.trim(),date:jd.value,repeat:jr.value,price:Number(jp.value||0),done:false})});await load();jobs()}catch(e){alert(e.message)}}
async function toggleJob(id){let j=data.jobs.find(x=>x.id===id);try{await req('/rest/v1/jobs?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({done:!j.done})});if(!j.done&&days[j.repeat]){let d=new Date(j.date+'T12:00:00');d.setDate(d.getDate()+days[j.repeat]);let next=d.toISOString().slice(0,10);await req('/rest/v1/jobs',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user_id,customer_id:j.customer_id,title:j.title,date:next,repeat:j.repeat,price:Number(j.price||0),done:false})})}await load();render()}catch(e){alert(e.message)}}
function calendar(){let first=new Date(cal.getFullYear(),cal.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-(first.getDay()||7)+1);let cells='';for(let n=0;n<42;n++){let d=new Date(start);d.setDate(start.getDate()+n);let ds=d.toISOString().slice(0,10),js=data.jobs.filter(j=>j.date===ds&&!j.done);cells+=`<div class="day ${ds===today()?'today':''}"><b>${d.getDate()}</b>${js.slice(0,3).map(j=>`<div class="jobdot" onclick="setPage('jobs')">${esc(cname(j.customer_id))}</div>`).join('')}</div>`}app.innerHTML=`<h2>Calendar</h2><div class="card"><div class="row"><button class="secondary" onclick="cal.setMonth(cal.getMonth()-1);calendar()">←</button><h3>${cal.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3><button class="secondary" onclick="cal.setMonth(cal.getMonth()+1);calendar()">→</button></div><div class="calendar" style="margin-top:12px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('')}${cells}</div></div>`}
function quotes(){app.innerHTML=`<h2>Quotes</h2><div class="card"><div class="form"><label>Customer</label><select id="qc">${data.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Description</label><input id="qt" placeholder="New patio and planting"><label>Amount</label><input id="qa" type="number" step=".01" min="0"><button onclick="addQuote()" ${data.customers.length?'':'disabled'}>Add quote</button></div></div><div class="list">${data.quotes.map(q=>`<div class="item"><div><strong>${esc(q.title)}</strong><small>${esc(cname(q.customer_id))} · ${fmtMoney(q.amount)} · <span class="badge">${esc(q.status)}</span></small></div><div>${q.status!=='Accepted'?`<button class="small" onclick="acceptQuote('${q.id}')">Accept</button>`:''}<button class="secondary small" onclick="printDoc('QUOTE','${q.id}')">Print</button>${q.status==='Accepted'?`<button class="small" onclick="convertQuote('${q.id}')">Invoice</button>`:''}</div></div>`).join('')||'<div class="card empty">No quotes yet.</div>'}</div>`}
async function addQuote(){if(!qt.value.trim())return alert('Enter a description.');try{await req('/rest/v1/quotes',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user_id,customer_id:qc.value,title:qt.value.trim(),amount:Number(qa.value||0),status:'Draft'})});await load();quotes()}catch(e){alert(e.message)}}
async function acceptQuote(id){try{await req('/rest/v1/quotes?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'Accepted'})});await load();quotes()}catch(e){alert(e.message)}}
async function convertQuote(id){let q=data.quotes.find(x=>x.id===id);try{await req('/rest/v1/invoices',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user_id,customer_id:q.customer_id,title:q.title,amount:Number(q.amount||0),status:'Unpaid'})});await load();invoices()}catch(e){alert(e.message)}}
function invoices(){app.innerHTML=`<h2>Invoices</h2><div class="card"><div class="form"><label>Customer</label><select id="ic">${data.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Description</label><input id="it" placeholder="Garden maintenance"><label>Amount</label><input id="ia" type="number" step=".01" min="0"><button onclick="addInvoice()" ${data.customers.length?'':'disabled'}>Add invoice</button></div></div><div class="list">${data.invoices.map(i=>`<div class="item"><div><strong>${esc(i.title)}</strong><small>${esc(cname(i.customer_id))} · ${fmtMoney(i.amount)} · <span class="badge ${i.status==='Paid'?'':'red'}">${esc(i.status)}</span></small></div><div><button class="secondary small" onclick="printDoc('INVOICE','${i.id}')">Print</button><button class="small" onclick="invoiceStatus('${i.id}')">${i.status==='Paid'?'Unpay':'Mark paid'}</button></div></div>`).join('')||'<div class="card empty">No invoices yet.</div>'}</div>`}
async function addInvoice(){if(!it.value.trim())return alert('Enter a description.');try{await req('/rest/v1/invoices',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user_id,customer_id:ic.value,title:it.value.trim(),amount:Number(ia.value||0),status:'Unpaid'})});await load();invoices()}catch(e){alert(e.message)}}
async function invoiceStatus(id){let i=data.invoices.find(x=>x.id===id);try{await req('/rest/v1/invoices?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:i.status==='Paid'?'Unpaid':'Paid'})});await load();invoices()}catch(e){alert(e.message)}}
function moneyPage(){let paid=data.invoices.filter(i=>i.status==='Paid').reduce((a,x)=>a+Number(x.amount||0),0),out=data.invoices.filter(i=>i.status!=='Paid').reduce((a,x)=>a+Number(x.amount||0),0),ex=data.expenses.reduce((a,x)=>a+Number(x.amount||0),0);app.innerHTML=`<h2>Money</h2><div class="grid"><div class="card"><div class="muted">Paid invoices</div><div class="stat">${fmtMoney(paid)}</div></div><div class="card"><div class="muted">Outstanding</div><div class="stat">${fmtMoney(out)}</div></div><div class="card"><div class="muted">Expenses</div><div class="stat">${fmtMoney(ex)}</div></div><div class="card"><div class="muted">Recorded profit</div><div class="stat">${fmtMoney(paid-ex)}</div></div></div><div class="card"><h3>Add expense</h3><div class="form"><label>Date</label><input id="ed" type="date" value="${today()}"><label>Description</label><input id="et" placeholder="Fuel, materials, tools"><label>Amount</label><input id="ea" type="number" step=".01" min="0"><button onclick="addExpense()">Add expense</button></div></div><div class="card"><h3>Expenses</h3>${data.expenses.length?data.expenses.map(e=>`<div class="item"><div><b>${esc(e.description)}</b><small>${fmtDate(e.date)}</small></div><b class="redtext">-${fmtMoney(e.amount)}</b></div>`).join(''):'<div class="empty">No expenses recorded.</div>'}</div>`}
async function addExpense(){if(!et.value.trim())return alert('Enter a description.');try{await req('/rest/v1/expenses',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user_id,date:ed.value,description:et.value.trim(),amount:Number(ea.value||0)})});await load();moneyPage()}catch(e){alert('The expenses table is not enabled yet. Run the updated SQL file once in Supabase.') }}
function printDoc(type,id){let arr=type==='QUOTE'?data.quotes:data.invoices,x=arr.find(a=>a.id===id),c=data.customers.find(a=>a.id===x.customer_id),w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print.');w.document.write(`<html><head><title>GardenPro ${type}</title><style>body{font-family:Arial;padding:40px;color:#173b24}h1{color:#1f7a3d}table{width:100%;border-collapse:collapse;margin-top:30px}td{padding:14px;border-bottom:1px solid #ddd}.total{font-size:22px;font-weight:bold}</style></head><body><h1>🌿 GardenPro</h1><h2>${type}</h2><p><b>Customer:</b> ${esc(c?.name||'')}<br>${esc(c?.address||'')}<br>${esc(c?.email||'')} ${esc(c?.phone||'')}</p><table><tr><td>${esc(x.title)}</td><td style="text-align:right">${fmtMoney(x.amount)}</td></tr><tr><td class="total">Total</td><td class="total" style="text-align:right">${fmtMoney(x.amount)}</td></tr></table><p style="margin-top:50px">Professional gardener business management</p></body></html>`);w.document.close();w.print()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
async function boot(){try{await load();await render()}catch(e){try{if(session?.refresh_token){session=await auth('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});session.user_id=session.user?.id||session.user_id;save();await load();await render();return}}catch(re){e=re}head();app.innerHTML=`<div class="card"><h2>GardenPro could not load</h2><p>${esc(e.message)}</p><p class="muted">Refresh the page and try again.</p></div>`;navigation()}}
if(session)boot();else{head();loginScreen()}
</script>
</body></html>
