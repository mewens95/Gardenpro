name: Build GardenPro Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GardenPro
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node packages
        run: npm install --no-audit --no-fund

      - name: Prepare mobile web files
        run: |
          rm -rf www
          mkdir www
          cp index.html manifest.webmanifest sw.js www/
          cp icon-192.png icon-512.png www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Configure Android 16 / API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/variables.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', s)
          s=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
          s=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
          p.write_text(s)
          PY

      - name: Generate temporary upload key
        run: |
          export KEYSTORE_PASSWORD="GardenProTemp2026!"
          export KEY_PASSWORD="GardenProTemp2026!"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore android/gardenpro-upload.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias gardenpro-upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GardenPro, OU=GardenPro, O=GardenPro, L=Glasgow, ST=Scotland, C=GB"

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          signing = '''\n    signingConfigs {\n        release {\n            storeFile file('../gardenpro-upload.jks')\n            storePassword System.getenv('KEYSTORE_PASSWORD')\n            keyAlias 'gardenpro-upload'\n            keyPassword System.getenv('KEY_PASSWORD')\n        }\n    }\n'''
          s=s.replace('android {', 'android {' + signing, 1)
          s=s.replace('release {\n            minifyEnabled false', "release {\n            signingConfig signingConfigs.release\n            minifyEnabled false", 1)
          p.write_text(s)
          PY

      - name: Build signed Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Export upload certificate
        run: |
          keytool -export -rfc \
            -keystore android/gardenpro-upload.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias gardenpro-upload \
            -file gardenpro-upload-certificate.pem

      - name: Upload GardenPro Play bundle and certificate
        uses: actions/upload-artifact@v4
        with:
          name: GardenPro-Play-Upload
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            gardenpro-upload-certificate.pem
          retention-days: 30
          if-no-files-found: error
